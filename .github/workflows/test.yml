name: Backend Testleri

on:
  push:
    paths:
      - "arassaha-backend/**"
  pull_request:
    paths:
      - "arassaha-backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arassaha-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.5"
          cache: "npm"
          cache-dependency-path: arassaha-backend/package-lock.json

      - run: npm ci
      - run: npm test
        env:
          # .env dosyası .gitignore'da olduğundan CI checkout'unda yok — testlerin
          # imzaladığı/doğruladığı JWT'ler için burada sabit bir test secret'ı
          # sağlanıyor. Gerçek (Railway) JWT_SECRET ile aynı olması GEREKMİYOR,
          # yalnızca bu CI çalışması içinde imzalama/doğrulama aynı değeri
          # kullandığı sürece testler geçer.
          JWT_SECRET: test-only-ci-secret
