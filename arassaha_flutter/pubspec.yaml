name: arassaha_flutter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # ArasSaha - İş Emri modülü için eklenen paketler
  http: ^1.2.2
  http_parser: ^4.0.2
  mime: ^1.0.6
  provider: ^6.1.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  fl_chart: ^0.69.2
  google_fonts: ^6.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Cihaz Yönetimi modülü — "Zorla Senkronize Et" bu cihazın (uygulamanın
  # çalıştığı fiziksel cihazın) GERÇEK pil seviyesini/model bilgisini okur.
  battery_plus: ^6.2.1
  device_info_plus: ^11.2.0

  # Tema tercihini (açık/koyu) kalıcı saklamak için — splash ekranının bir
  # sonraki açılışta doğru modda gösterilebilmesi buna bağlı (bkz. MainActivity.kt).
  shared_preferences: ^2.3.3

  # Native splash ekranını Dart tarafından ne zaman kaldıracağımızı kontrol
  # etmek için (FlutterNativeSplash.preserve/remove) — tema tercihi
  # yüklenirken splash ekranda kalır, ani beyaz/varsayılan tema yanıp
  # sönmesi (flash) önlenir. Görsel üretimi de bu paketle yapılır
  # (dart run flutter_native_splash:create).
  flutter_native_splash: ^2.4.3
  mobile_scanner: ^7.4.0
  geolocator: ^14.0.2

  # Bildirim Sistemi (Modül 6) — cihazda GERÇEK bir OS bildirimi göstermek için.
  # Bir staj projesi kapsamında Firebase Cloud Messaging (proje açma, sunucu
  # anahtarı, native push kurulumu) gereksiz karmaşıklık katardığından, bunun
  # yerine backend'in periyodik olarak (polling) yoklanmasıyla tetiklenen
  # YEREL bir bildirim yaklaşımı kullanılıyor (bkz. services/local_notification_service.dart).
  flutter_local_notifications: ^22.2.0

  # Ayarlar ve Çevrimdışı Mod (Modül 17) — bkz. services/cache_service.dart,
  # services/offline_queue_service.dart, providers/connectivity_provider.dart.
  # hive/hive_flutter: yerel önbellek ve çevrimdışı yazma kuyruğu için
  # shared_preferences'tan daha esnek, JSON benzeri (Map) veri saklar.
  # connectivity_plus: bağlantı durumu (var/yok) değişikliklerini dinlemek için.
  # uuid: çevrimdışı kuyruğa eklenen her işlem için istemci tarafında üretilen,
  # idempotency'nin dayandığı benzersiz client_action_id için (bkz. backend
  # processed_client_actions tablosu).
  # package_info_plus: Ayarlar ekranındaki "Hakkında" bölümünde uygulama
  # sürümünü elle sabit yazmak yerine gerçek build bilgisinden okumak için.
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.3
  uuid: ^4.5.1
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Uygulama ikonu (launcher icon) üretimi için — sadece derleme zamanında
  # çalışır, uygulamaya gömülmez.
  flutter_launcher_icons: ^0.14.3

# Marka revizyonu: yeni SAHA.png uygulama ikonu olarak kullanılıyor. SAHA.png
# opak beyaz zeminli tek parça bir görsel (adaptive_icon_foreground gibi ayrı
# bir şeffaf katmanı yok) — bu yüzden eski adaptive_icon_background/foreground
# çifti yerine tek `image_path` yeterli.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/SAHA.png"

flutter_native_splash:
  # Marka revizyonu: SAHA.png opak/beyaz zeminli bir görsel (eski
  # aras_splash_logo_white.png gibi şeffaf/beyaza boyanmış bir splash-özel
  # varyantı YOK) — bu yüzden splash zemin rengi de logonun kendi beyaz
  # zeminiyle KAYNAŞSIN diye beyaza çekildi; eski canlı mavi (#0D5FA8) zeminde
  # bırakılsaydı logo çevresinde belirgin bir beyaz dikdörtgen ("kutu")
  # görünürdü. Logonun şeffaf/beyaza-boyanmış bir versiyonu sağlanırsa mavi
  # zemine geri dönülebilir.
  color: "#FFFFFF"
  image: assets/images/SAHA.png
  color_dark: "#FFFFFF"
  image_dark: assets/images/SAHA.png
  android_12:
    image: assets/images/SAHA.png
    icon_background_color: "#FFFFFF"
    image_dark: assets/images/SAHA.png
    icon_background_color_dark: "#FFFFFF"
  android: true
  ios: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/SAHA.png
    - assets/images/ArasAI_LOGO.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
